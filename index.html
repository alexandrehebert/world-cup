<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(() => {
        try {
          const storageKey = 'theme-preference'
          const stored = window.localStorage.getItem(storageKey)
          const systemTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          const theme = stored === 'light' || stored === 'dark' || stored === 'colorblind' ? stored : systemTheme

          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark'
        } catch {
          // Keep default CSS media-query behavior if storage is unavailable.
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght,FILL,GRAD@300..700,0..1,0..1&display=block" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght,FILL,GRAD@300..700,0..1,0..1&display=block"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Cup</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
