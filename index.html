<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      #loader-root {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 12% -8%, rgba(0, 217, 143, 0.19), transparent 35%),
          radial-gradient(circle at 90% 8%, rgba(0, 160, 255, 0.22), transparent 41%),
          linear-gradient(160deg, #070e19 0%, #0d1728 52%, #111f35 100%);
        color: #00d98f;
        opacity: 1;
        pointer-events: auto;
        transition: opacity 300ms ease-out;
      }

      [data-theme='light'] #loader-root {
        background: radial-gradient(circle at 7% 2%, rgba(0, 123, 79, 0.18), transparent 31%),
          radial-gradient(circle at 97% 0%, rgba(40, 127, 207, 0.2), transparent 39%),
          linear-gradient(180deg, #f6fbff 0%, #e9f3fb 55%, #deebf8 100%);
        color: #007b4f;
      }

      [data-theme='colorblind'] #loader-root {
        background: radial-gradient(circle at 16% -8%, rgba(255, 176, 0, 0.17), transparent 35%),
          radial-gradient(circle at 88% 10%, rgba(70, 140, 220, 0.2), transparent 43%),
          linear-gradient(160deg, #0a1424 0%, #0f1d33 52%, #12233b 100%);
        color: #ffb000;
      }

      .loader-svg {
        width: 120px;
        height: 120px;
        color: inherit;
        animation: loader-spin 2s linear infinite;
      }

      @keyframes loader-spin {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      ;(() => {
        try {
          const storageKey = 'theme-preference'
          const stored = window.localStorage.getItem(storageKey)
          const systemTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          const theme = stored === 'light' || stored === 'dark' || stored === 'colorblind' ? stored : systemTheme

          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark'
        } catch {
          // Keep default CSS media-query behavior if storage is unavailable.
        }
      })()
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Cup</title>
