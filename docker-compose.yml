services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${APP_PORT:-3001}:3000'
    environment:
      MONGODB_URI: mongodb://mongo:27017/world-cup
      MONGODB_DB: world-cup
      SESSION_SECRET: ${SESSION_SECRET:-local-session-secret}
      CRON_SECRET: ${CRON_SECRET:-local-cron-secret}
      MATCH_RESULTS_URL: ${MATCH_RESULTS_URL:-https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard}
    command: ['npm', 'run', 'dev', '--', '--hostname', '0.0.0.0', '--port', '3000']
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping").ok']
      interval: 5s
      timeout: 3s
      retries: 10

  cron:
    image: alpine:3.22
    command: >
      sh -c "
      apk add --no-cache curl &&
      sh /app/docker/cron/start-cron.sh
      "
    environment:
      CRON_SECRET: ${CRON_SECRET:-local-cron-secret}
    depends_on:
      - app
    volumes:
      - ./:/app:ro
